<title>台積電 N2 晶圓之旅</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面：上方幕次軌道 → 雙剖面舞台 → 操作列 → 左文右圖例的說明區。材料色是內容，UI 色退在後面。 */
:root {
  --bg: #eef2f1; --panel: #ffffff; --fg: #13201c; --muted: #56665f; --line: #d3dcd8;
  --accent: #b4430f; --accent-soft: #f7e3d8; --stage: #f8faf9;
  --m-si: #8fb0d3; --m-sige: #e2ae45; --m-sub: #6f8fb3; --m-ox: #bfe2e9; --m-nit: #b6d3a8;
  --m-poly: #b46a5c; --m-sd: #3f9a85; --m-highk: #8455c4; --m-metal: #56606e; --m-mask: #3d4650; --m-sti: #9fb5b9;
  --tag-official: #0f6b55; --tag-paper: #3c5ba8; --tag-media: #8a5a12; --tag-generic: #6a6f75; --tag-vendor: #7a4fa0;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1315; --panel: #141c1f; --fg: #e4ebe8; --muted: #93a39d; --line: #26343a;
  --accent: #f08a4b; --accent-soft: #3a2418; --stage: #10181b;
  --m-si: #7fa6cf; --m-sige: #d9a33a; --m-sub: #4f6f93; --m-ox: #5f8f99; --m-nit: #7fa271;
  --m-poly: #b0685a; --m-sd: #3fae94; --m-highk: #a57ae6; --m-metal: #a9b3bf; --m-mask: #8b96a3; --m-sti: #8d9ea0;
  --tag-official: #4fc9a6; --tag-paper: #8aa6f0; --tag-media: #e2b05a; --tag-generic: #a3a9af; --tag-vendor: #c9a2f0;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1315; --panel: #141c1f; --fg: #e4ebe8; --muted: #93a39d; --line: #26343a;
  --accent: #f08a4b; --accent-soft: #3a2418; --stage: #10181b;
  --m-si: #7fa6cf; --m-sige: #d9a33a; --m-sub: #4f6f93; --m-ox: #5f8f99; --m-nit: #7fa271;
  --m-poly: #b0685a; --m-sd: #3fae94; --m-highk: #a57ae6; --m-metal: #a9b3bf; --m-mask: #8b96a3; --m-sti: #8d9ea0;
  --tag-official: #4fc9a6; --tag-paper: #8aa6f0; --tag-media: #e2b05a; --tag-generic: #a3a9af; --tag-vendor: #c9a2f0;
  color-scheme: dark; }

body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1160px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: 20px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

header.top { display: grid; gap: 6px; }
.kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: clamp(26px, 4.2vw, 40px); font-weight: 900; line-height: 1.2; letter-spacing: .01em; }
h1 .node { font-family: var(--font-mono); font-weight: 500; color: var(--accent); }
.lede { color: var(--muted); max-width: 62ch; margin: 0; }
.notice { font-size: 13px; color: var(--muted); border-left: 3px solid var(--m-sige); padding: 4px 0 4px 10px; max-width: 80ch; margin: 0; }

/* 幕次軌道 */
nav.rail { overflow-x: auto; padding-bottom: 4px; }
/* 欄寬依各幕步數由程式設定（每欄至少放得下幕名）；比畫面寬時在 nav 內橫向捲動 */
.acts { display: grid; gap: 10px; }
.act { display: grid; gap: 6px; }
.act-name { font-size: 12px; color: var(--muted); white-space: nowrap; }
.act-name b { color: var(--fg); font-weight: 700; margin-right: 4px; }
.act.cur .act-name b { color: var(--accent); }
.dots { display: flex; gap: 4px; }
.dot { flex: 1; min-width: 22px; height: 30px; border: 1px solid var(--line); background: var(--panel); border-radius: 4px;
  font: 500 11px var(--font-mono); color: var(--muted); cursor: pointer; padding: 0;
  transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease; }
.dot.done { background: var(--accent-soft); color: var(--fg); }
.dot.cur { background: var(--accent); border-color: var(--accent); color: #fff; }
.dot:focus-visible, button:focus-visible, summary:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 舞台 */
.stage { background: var(--stage); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; position: relative; }
.stage-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; justify-content: space-between; }
.stage-head .where { font-size: 13px; color: var(--muted); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.badge.generic { color: var(--tag-generic); } .badge.official { color: var(--tag-official); } .badge.media { color: var(--tag-media); } .badge.paper { color: var(--tag-paper); } .badge.vendor { color: var(--tag-vendor); }
.head-r { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; position: relative; }
.panel { display: grid; gap: 4px; min-width: 0; }
.panel-title { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
.panel-title .cut { font-family: var(--font-mono); font-weight: 500; color: var(--accent); }
/* SVG 放在固定比例的框裡、以絕對定位填滿：不依賴百分比高度，iOS Safari 才不會算錯尺寸 */
.svgbox { position: relative; aspect-ratio: 4 / 3; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.svgbox svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.panel-cap { font-size: 13px; color: var(--muted); min-height: 2.6em; margin: 0; }

/* 操作列：三欄固定，按鈕位置不受拍數指示影響 */
.controls { display: grid; grid-template-columns: minmax(0, 1fr) 112px minmax(0, 1fr); align-items: center; gap: 12px; }
.nav { width: min(100%, 200px); }
#prev { justify-self: start; } #next { justify-self: end; }
.btn.ghost { font-size: 13px; padding: 6px 12px; }
.btn { font: 700 15px var(--font-body); padding: 10px 18px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  transition: transform 120ms var(--ease-out), background-color 160ms ease; }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
.btn:disabled:active { transform: none; }
.beatinfo { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.pips { display: flex; gap: 5px; justify-content: center; }
.pip { width: 18px; height: 6px; border-radius: 3px; background: var(--line); transition: background-color 200ms ease; }
.pip.on { background: var(--accent); }
.hint { font-size: 12px; color: var(--muted); margin: 0; text-align: center; }

/* 沉浸模式：舞台蓋滿整個畫面，操作列固定在底部 */
.imm-now { display: none; }
html.imm-lock, html.imm-lock body { overflow: hidden; }
.stage.immersive { position: fixed; inset: 0; z-index: 100; border: 0; border-radius: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 8px; overscroll-behavior: contain; }
.stage.immersive .badges, .stage.immersive .hint { display: none; }
.stage.immersive .imm-now { display: block; margin: 0; font-weight: 500; line-height: 1.5; min-height: 3em; }
.stage.immersive .panels { flex: 1; min-height: 0; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; touch-action: pan-y; }
.stage.immersive .panel { grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
.stage.immersive .svgbox { aspect-ratio: auto; }
.stage.immersive .panel-cap { min-height: 0; font-size: 12px; line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stage.immersive .nav { width: 100%; padding-block: 14px; }
@media (orientation: landscape) { .stage.immersive .panels { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); } }
/* 手機橫拿：高度很少，把文字壓到最精簡，材料卡改為浮在圖上 */
@media (orientation: landscape) and (max-height: 520px) {
  .stage.immersive { gap: 4px; padding-top: calc(env(safe-area-inset-top, 0px) + 6px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); }
  .stage.immersive .panel-cap { display: none; }
  .stage.immersive .imm-now { min-height: 0; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .stage.immersive .nav { padding-block: 8px; }
  .stage.immersive .imm-part { position: absolute; z-index: 2; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 58px); box-shadow: 0 6px 24px rgb(0 0 0 / .25); }
}
.imm-part { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; font-size: 13px; }
.imm-part .row { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px; }
.imm-part .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.imm-part .x { margin-left: auto; font: 500 13px var(--font-body); background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 6px; }
.imm-part p { margin: 0; }

/* 說明區 */
.info { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: grid; gap: 12px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--muted); }
h2 { font-size: 24px; font-weight: 900; line-height: 1.3; }
.now { margin: 0; padding: 10px 12px; background: var(--accent-soft); border-radius: 6px; }
.now .lab { font-size: 12px; color: var(--accent); font-weight: 700; display: block; }
.plain { margin: 0; max-width: 65ch; }
details { border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; font-weight: 700; }
details p { margin: 8px 0 0; max-width: 65ch; }
h3 { font-size: 14px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
ol.src { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13px; }
ol.src a { color: var(--fg); text-decoration-color: var(--line); text-underline-offset: 3px; word-break: break-word; }
ol.src .t { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid currentColor; margin-right: 6px; white-space: nowrap; }
.part-name { font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
.part-name .sw { width: 14px; height: 14px; border-radius: 3px; flex: none; }
.part-en { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.part-text { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 13px var(--font-body); padding: 4px 10px 4px 6px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
.chip .sw { width: 12px; height: 12px; border-radius: 3px; }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.muted { color: var(--muted); font-size: 13px; margin: 0; }
#suppliers { display: grid; gap: 8px; font-size: 13px; }
.supg { display: grid; gap: 2px; }
.supg b { font-weight: 700; }
.supg > span { display: flex; flex-wrap: wrap; gap: 2px 12px; }
.sup.M { color: var(--muted); }
footer { font-size: 12px; color: var(--muted); }

/* SVG 材料與動畫 */
svg .el { opacity: 0; pointer-events: none; cursor: pointer;
  transition: opacity 420ms var(--ease-out), transform 640ms var(--ease-out); transition-delay: 0ms; }
svg .el[data-fx="grow"] { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0.04); }
svg .el[data-fx="drop"] { transform: translateY(-18px); }
svg .el[data-fx="rise"] { transform: translateY(14px); }
svg .el[data-fx="growx"] { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0.04); }
svg .el.on { opacity: 1; transform: none; pointer-events: auto; transition-delay: var(--d, 0ms); }
svg .el.sel:not([data-part="printed"]):not([data-part="drc"]) { stroke: var(--accent); stroke-width: 2.5px; vector-effect: non-scaling-stroke; }
[data-part="si-sub"] { fill: var(--m-sub); } [data-part="si-sheet"] { fill: var(--m-si); } [data-part="sige"] { fill: var(--m-sige); }
[data-part="hardmask"] { fill: var(--m-mask); } [data-part="dummy"] { fill: var(--m-poly); } [data-part="gspacer"], [data-part="inner"] { fill: var(--m-nit); }
[data-part="sti"] { fill: var(--m-sti); }
svg rect { shape-rendering: crispEdges; }
[data-part="sd"] { fill: var(--m-sd); } [data-part="ild"] { fill: var(--m-ox); } [data-part="highk"] { fill: var(--m-highk); } [data-part="metal"] { fill: var(--m-metal); }
svg .arrow { fill: var(--accent); }
svg .axis { font: 500 14px var(--font-body); fill: var(--muted); }
/* 第一幕：示意圖用的框、文字與線 */
svg .nbox { fill: var(--panel); stroke: var(--line); stroke-width: 1.5px; }
svg .lbl { font: 500 14px var(--font-body); fill: var(--fg); }
svg .lbl-s { font: 400 12px var(--font-body); fill: var(--muted); }
svg .mono-t { font: 500 16px var(--font-mono); fill: var(--fg); }
svg .ln { fill: none; stroke: var(--muted); stroke-width: 1.5px; }
svg .arrow-m { fill: var(--muted); }
svg .hl, svg .ring { fill: none; stroke: var(--accent); stroke-width: 2.5px; }
svg .crit { fill: none; stroke: var(--accent); stroke-width: 4px; stroke-linejoin: round; }
svg .beam { stroke: var(--accent); stroke-width: 3px; stroke-dasharray: 4 4; }
svg .ghost { fill: none; stroke: var(--muted); stroke-width: 1.5px; stroke-dasharray: 5 4; }
svg .band { fill: var(--accent); fill-opacity: .18; }
[data-part="kit"], [data-part="masksvc"] { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5px; }
[data-part="eda"] { fill: var(--panel); stroke: var(--m-sd); stroke-width: 2px; }
[data-part="cell-short"], [data-part="stdcell"], [data-part="design"] { fill: var(--m-si); stroke: var(--panel); }
[data-part="cell-tall"] { fill: var(--m-sige); stroke: var(--panel); }
[data-part="wire"] { fill: var(--m-metal); }
[data-part="drc"] { fill: none; stroke: var(--accent); stroke-width: 2.5px; }
[data-part="shuttle"] { stroke: var(--panel); stroke-width: 2px; }
[data-part="target"], [data-part="opc"], [data-part="curvy"], [data-part="absorber"] { fill: var(--m-mask); }
[data-part="sraf"] { fill: var(--m-mask); fill-opacity: .55; }
[data-part="printed"] { fill: none; stroke: var(--m-sd); }
[data-part="mask-sub"] { fill: var(--m-sti); }
[data-part="cap"] { fill: var(--m-sd); }
[data-part="defect"] { fill: var(--accent); }
[data-part="pellicle"] { fill: var(--m-ox); }
[data-part="resist"] { fill: var(--m-nit); }
[data-part="rdlpad"] { fill: var(--m-sige); }
[data-part="ild2"] { fill: var(--m-ox); }
[data-part="contact"] { fill: var(--m-mask); }
[data-part="beol"] { fill: var(--m-metal); }
[data-part="mim"] { fill: var(--m-highk); }
[data-part="rdl"] { fill: var(--m-poly); }
[data-part="passiv"] { fill: var(--m-nit); }
[data-part="wafer"] { fill: var(--m-si); }
[data-part="die"] { fill: var(--m-sub); }
[data-part="wat"], [data-part="fail"] { fill: var(--accent); }
[data-part="pad"], [data-part="die2"] { fill: var(--m-sige); }
[data-part="interposer"] { fill: var(--m-sti); }
[data-part="hbm"] { fill: var(--m-si); }
[data-part="pkgsub"] { fill: var(--m-sd); }
[data-part="pkg"] { fill: var(--m-metal); }
[data-part="node"] { fill: var(--m-sd); }
[data-part="nodef"] { fill: var(--panel); stroke: var(--m-sd); stroke-width: 2.5px; stroke-dasharray: 3 3; }
svg .bar { fill: var(--m-mask); } svg .bar.hi { fill: var(--accent); }
svg .el.sel[data-part="printed"] { stroke: var(--accent); }
@media (hover: hover) and (pointer: fine) { svg .el.on:hover { filter: brightness(1.12); } .dot:hover { border-color: var(--accent); } }
@media (prefers-reduced-motion: reduce) {
  svg .el, svg .el[data-fx] { transform: none; transition: opacity 200ms ease; }
  svg .el.on { transition-delay: 0ms; }
  .btn:active { transform: none; }
}
@media (max-width: 760px) {
  .panels, .info { grid-template-columns: 1fr; }
  .controls { grid-template-columns: minmax(0, 1fr) 88px minmax(0, 1fr); gap: 8px; }
  .nav { width: 100%; }
}
/* 幕次軌道上的主線標記、說明區的「交會」標籤、圖片載入失敗時的來源連結 */
.act-line { margin-left: 6px; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; font-size: 11px; }
.cross { display: flex; flex-wrap: wrap; gap: 6px; }
.cross[hidden] { display: none; }
.cross .chip { padding: 4px 10px; }
svg .lnk { fill: var(--accent); text-decoration: underline; }
</style>

<div class="wrap">
  <header class="top">
    <div class="kicker" id="kicker"></div>
    <h1 id="headline"></h1>
    <p class="lede" id="lede"></p>
    <p class="notice" id="notice"></p>
  </header>

  <nav class="rail" aria-label="製程步驟">
    <div class="acts" id="acts"></div>
  </nav>

  <section class="stage" id="stage" aria-label="製程動畫">
    <div class="stage-head">
      <div class="where" id="where"></div>
      <div class="head-r">
        <div class="badges" id="badges"></div>
        <button class="btn ghost" id="immBtn" type="button" aria-pressed="false">全螢幕觀看</button>
      </div>
    </div>
    <p class="imm-now" id="immNow" aria-live="polite"></p>
    <div class="panels" id="panels">
      <figure class="panel" style="margin:0">
        <figcaption class="panel-title"><span class="cut" id="paCut"></span><span id="paText"></span></figcaption>
        <div class="svgbox"><svg id="svgA" viewBox="0 0 400 300" role="img" aria-label="左圖"></svg></div>
        <p class="panel-cap" id="capA"></p>
      </figure>
      <figure class="panel" style="margin:0">
        <figcaption class="panel-title"><span class="cut" id="pbCut"></span><span id="pbText"></span></figcaption>
        <div class="svgbox"><svg id="svgB" viewBox="0 0 400 300" role="img" aria-label="右圖"></svg></div>
        <p class="panel-cap" id="capB"></p>
      </figure>
    </div>
    <div class="imm-part" id="immPart" hidden></div>
    <div class="controls">
      <button class="btn nav" id="prev" type="button">上一步</button>
      <div class="beatinfo"><span id="beatlabel" class="mono"></span><div class="pips" id="pips"></div></div>
      <button class="btn primary nav" id="next" type="button">下一步</button>
    </div>
    <p class="hint">鍵盤 ← → 切換，Esc 離開全螢幕；手機全螢幕時可左右滑動。</p>
  </section>

  <section class="info">
    <article class="card" aria-live="polite">
      <div class="eyebrow" id="eyebrow"></div>
      <h2 id="title"></h2>
      <div class="cross" id="cross" hidden></div>

      plain: '先從尺度開始：一片 12 吋晶圓上排滿一顆顆晶片，每顆晶片裡有數量龐大的電晶體。這份頁面要看的，就是 N2 的電晶體怎麼一步步做出來，以及做好之後怎麼變成可以出貨的晶片。',
      detail: ['台積電的 12 吋超大晶圓廠（GIGAFAB）目前有六座：Fab 12、14、15、18、20、22；截至 2025 年，合計產能超過 1,300 萬片 12 吋約當晶圓，製程涵蓋 0.13 微米到 2 奈米（台積電官網）。', '「2nm」「N2」是製程世代的名稱，不是電晶體上某個部位的實際尺寸。IEEE Spectrum 2013 年的報導指出，節點名稱早已不對應晶片上任何特定的尺寸；Intel 的 Mark Bohr 也說，他指不出哪一個尺寸剛好是 32、22 或 14 奈米。', '台積電沒有公開 N2 奈米片的片數、片寬與片厚；圖中畫三片只是示意。'],
      beats: [
        { now: '一片 12 吋（300mm）晶圓，上面排滿晶片。', a: '晶圓上的每個小方塊都是一顆晶片（示意）。', b: '台積電的 12 吋晶圓廠。' },
        { now: '拉近：一顆晶片裡分成許多電路區塊。', a: '一顆晶片（示意）；框起來的地方再拉近。', b: '晶片尺寸依產品而定。' },
        { now: '再拉近：電路是由一顆顆電晶體組成，N2 用的是奈米片電晶體。', a: '一顆奈米片電晶體的剖面（示意）。', b: '「2nm」是世代名稱，不是實際尺寸。' },
      ],
      supNote: '序幕不列廠商。',
      sources: ['tsmc_gigafab', 'spectrum2013'] },
    { n: 1, act: 1, title: '設計規則與 PDK', badges: ['official', 'vendor'],
      pa: ['①', '台積電交給設計者的工具'], pb: ['②', 'NanoFlex：高矮單元混排（示意）'],
      plain: '晶片設計公司要先知道製程做得到什麼。台積電把「版圖可以怎麼畫」寫成設計規則手冊（DRM），把製程資料包成製程設計套件（PDK），交給設計軟體使用。N2 還多了 NanoFlex：同一個設計區塊裡可以混用矮單元與高單元。',
      detail: ['台積電的開放創新平台（OIP）把設計軟體（EDA）、矽智財（IP）與設計服務夥伴串在一起。台積電會針對每個新製程認證 EDA 工具，狀態分為「已認證」與「進行中」，項目包括佈局佈線、時序與功耗、電遷移與壓降、實體驗證、寄生參數萃取、模擬與熱分析。台積電官網的認證表目前列的是 A14、A16、N2P、N3C；N2 本身的認證資訊來自 EDA 廠 2023–2024 年的新聞稿。', 'Cadence 在 2023 年 4 月宣布，它的設計流程通過台積電 N2 設計規則手冊的認證，雙方並交付 N2 的 PDK（廠商聲明）。', '標準單元（standard cell）是晶片設計的基本積木。NanoFlex 讓設計者在同一個設計區塊裡混用矮單元（強調小面積與省電）與高單元（強調效能）；台積電 2025 年宣布把它演進為 NanoFlex Pro。'],
      beats: [
        { now: '台積電把設計規則手冊與製程設計套件交給設計端。', a: '設計規則手冊與 PDK。', b: '一個設計區塊，分成高度不同的列。' },
        { now: 'EDA 軟體接受台積電認證；NanoFlex 讓高矮單元在同一區塊混排。', a: '台積電逐項認證 EDA 軟體。', b: '淺藍是矮單元，黃色是高單元。' },
      ],
      sources: ['tsmc_oip', 'tsmc_eda', 'cadence2023', 'pr3136', 'pr3228'] },
    { n: 2, act: 1, title: '設計實作與驗證', badges: ['official', 'vendor', 'generic'],
      pa: ['①', '設計流程'], pb: ['②', '版圖（示意）'],
      plain: '設計團隊用 EDA 軟體把電路變成實際的版圖：先把標準單元擺好、用金屬線連起來，再一關關驗證：訊號能不能準時抵達、耗電與壓降是否在範圍內、版圖有沒有違反設計規則、版圖和電路圖是否一致。驗證之後才進到 tape-out。',
      detail: ['台積電列出的 EDA 認證項目，就是這一段要過的關卡：佈局佈線（APR）、時序與功耗驗證（STA）、電遷移與壓降（EMIR）、實體驗證（DRC、LVS、dummy fill）、寄生參數萃取等。', 'Cadence 在 N3E／N2 的認證新聞稿中列出工具支援的新設計功能，例如混合單元列（hybrid cell row）最佳化（原文標明用於 N3E）與單元接腳對齊。Siemens 的 Calibre 實體驗證工具在 2023 年 9 月取得 N2 認證；Synopsys 同月宣布 N2 數位流程已有多個 tape-out（廠商聲明）。', 'sign-off（簽核）階段，會用簽核等級的工具驗證所有影響晶片效能或可製造性的關鍵參數。DRC（Design Rule Check）檢查設計是否符合製程技術的限制，例如導線之間的最小間距；LVS（Layout Versus Schematic）比對從版圖萃取的電路與原始電路圖是否一致（業界通用）。'],
      beats: [
        { now: '佈局佈線：擺好標準單元，再用金屬線連起來。', a: '流程走到佈局佈線。', b: '淺藍是標準單元，灰色是金屬繞線。' },
        { now: '時序與功耗驗證：檢查訊號能不能在時限內走完延遲最長的路徑。', a: '流程走到時序與功耗驗證。', b: '橘線標出延遲最長、最容易來不及的路徑（示意）。' },
        { now: '實體驗證：DRC 抓出違反設計規則的地方，LVS 比對版圖和電路圖。', a: '最後一關：實體驗證。', b: '圈起來的兩條線靠得太近，違反最小間距的規則。' },
      ],
      sources: ['tsmc_eda', 'cadence2023', 'siemens2023', 'synopsys2023', 'syn_icd', 'syn_pd', 'syn_drc', 'syn_lvs'] },
    { n: 3, act: 1, title: 'Tape-out 定稿', badges: ['official', 'generic'],
      pa: ['①', '從版圖到光罩服務'], pb: ['②', '一套光罩放幾個設計'],
      plain: 'Tape-out 是設計定稿、把整顆晶片的版圖資料交給晶圓廠的那一刻，也是光罩製作的起點。台積電的光罩服務就是設計者與晶圓廠之間的介面。',
      detail: ['版圖資料就是台積電公開頁面所說的 GDS 資料，是光罩製作的起點；晶片的圖形一層一層用光罩做出來（業界通用）。台積電 N2 專屬的 tape-out 審核流程沒有公開。', '原型階段可以走台積電的 CyberShuttle：多個設計共用一套「多專案光罩」，分攤光罩費用。台積電稱涵蓋 0.5 微米到 A14，每月最多 10 個梯次。'],
      beats: [
        { now: '把每一層的圖形打包成版圖資料。', a: '晶片的每一層都是一張圖，打包成 GDS 資料。', b: '一般做法：一套光罩只放一個設計。' },
        { now: '版圖資料交給台積電光罩服務，光罩製作從這裡開始。', a: '光罩服務是設計者與晶圓廠之間的介面。', b: 'CyberShuttle：多個設計共用一套光罩，分攤費用。' },
      ],
      supNote: '這一步沒有另列相關廠商。',
      sources: ['syn_pd', 'syn_litho', 'tsmc_mask', 'tsmc_shuttle'] },
    { n: 4, act: 1, title: '光罩資料修正', badges: ['official', 'paper', 'vendor', 'generic'],
      pa: ['①', '光罩上的圖形'], pb: ['②', '印到晶圓上的結果'],
      plain: '受限於曝光機的光學系統，直接照設計畫光罩，印出來會轉角變圓、線端縮短，線寬也會隨圖形疏密而偏差。所以光罩上的圖形要先「故意改形」：線端加寬、轉角補上小方塊、旁邊加上不會印出來的輔助圖形，讓印出來的結果接近設計。這叫光學鄰近修正（OPC）。',
      detail: ['台積電官網說，先進製程的光罩會例行對客戶的 GDS 資料做 OPC 轉換，OPC 模型涵蓋製程設備、材料與可製造性設計（DFM）的要求。', '更進一步的做法是曲線光罩：修正後的形狀不再只是直角，而是自由曲線。台積電作者的論文提到曲線 OPC 設計的光罩檢測，但台積電沒有公開 N2 是否採用。', '運算量非常大。NVIDIA 稱一套光罩的運算可能要 3,000 萬 CPU 小時以上（本頁換算：若以單一 CPU 計算，約等於不停跑 3,400 年）；台積電 2024 年起把 NVIDIA 的 cuLitho（用 GPU 加速運算微影）導入生產，台積電執行長在 NVIDIA 新聞稿中表示（廠商聲明）。'],
      beats: [
        { now: '直接照設計畫光罩：印出來轉角變圓、線端縮短。', a: '光罩上的圖形和設計一模一樣。', b: '虛線是設計，綠色是實際印出來的形狀。' },
        { now: 'OPC：故意在光罩上加寬線端、補轉角、加輔助線。', a: '線端加寬、轉角補小方塊；最左邊的細線是不會印出來的輔助圖形。', b: '印出來的形狀接近設計，轉角仍略圓（示意）。' },
        { now: '更進一步：曲線光罩，以及龐大的運算量。', a: '曲線光罩：修正形狀變成自由曲線（台積電未公開 N2 是否採用）。', b: '一套光罩的運算量。', pa: ['①', '光罩上的圖形（曲線光罩）'], pb: ['②', '運算量'] },
      ],
      sources: ['syn_litho', 'pat_umc_opc', 'pat_ibm_opc', 'tsmc_mask', 'spie2024', 'nvidia_culitho'] },
    { n: 5, act: 1, title: '光罩製作與檢測', badges: ['official', 'paper', 'media', 'generic'],
      pa: ['①', 'EUV 光罩剖面（示意）'], pb: ['②', '光罩俯視（示意）'],
      plain: 'EUV 光罩不是透光的玻璃片，而是一面會反射的鏡子：基板上疊了幾十層鉬與矽交替的薄膜，上面再做一層會吸收 EUV 光的圖形。圖形寫好後要檢測、修補，再視需要貼上保護膜（pellicle）。',
      detail: ['光罩寫入機用電子束把設計圖形直接寫到光罩上（業界通用）。台積電有自己的光罩廠，官網稱擁有全球最大的光罩製造能力。', '台積電作者 2023 年的論文指出，EUV 光罩上每個可能的缺陷，原本都要實際印到晶圓上評估，將近 3 天。同一篇論文介紹了一套直接用 EUV 光源檢視光罩的系統，可處理 N5、N3 及更先進節點的缺陷，每小時檢查超過 80 個位置（論文沒有點名 N2）。', '保護膜（pellicle）裝在框架上，保護光罩不受空氣中的微粒等汙染；光罩表面的汙染會造成晶圓上的製造缺陷（業界通用）。媒體轉述台積電 2024 年中的報告：自製的 EUV 保護膜壽命延長 4 倍、缺陷減少 80 倍（台積電原始報告未取得）。台積電 N2 的光罩是否全部貼保護膜，沒有公開資料。', '目前 EUV 光罩是 6 吋；台積電與 ASML 的目標是 2031 年前建立 12 吋光罩試產線。台積電官網列出的光罩例行檢查包括靜電損傷、刮傷、微粒、保護膜框架與老化。'],
      beats: [
        { now: '空白光罩：基板、鉬／矽多層膜、覆蓋層，最上面是吸收層。', a: '層數與厚度非依比例。', b: '光罩俯視：整面都是吸收層；橘色虛線是左圖剖面的位置。' },
        { now: '塗上光阻，電子束把圖形寫在光阻上。', a: '電子束停在光阻表面（示意，省略顯影等中間步驟）。', b: '虛線框是之後留下吸收層的地方，框外被電子束寫過。' },
        { now: '蝕刻後，吸收層只留在需要的地方。', a: '沒有吸收層的地方會反射 EUV 光。', b: '吸收層留下四條，位置與左圖的四段相同；縫裡露出覆蓋層。' },
        { now: '檢測：抓出缺陷、修補，再用 EUV 光確認能不能印出來。', a: '橘圈是一個缺陷。', b: '檢測系統掃過整片光罩；缺陷在橘色虛線上，與左圖是同一個。' },
        { now: '貼上保護膜（pellicle）。N2 是否每片光罩都貼，沒有公開資料。', a: '保護膜撐在框架上，和圖形隔一段距離。', b: '保護膜蓋住整片圖形區，框架立在圖形區外。' },
      ],
      sources: ['pat_amat_euv', 'pat_amat_euv2', 'syn_litho', 'pat_asml_pel', 'tsmc_mask', 'spie_amrs', 'toms_pellicle', 'pr3338'] },
    { n: 6, act: 2, title: '空白晶圓進廠', badges: ['generic'],
      pa: ['A–A′', '順著電流方向切開'], pb: ['B–B′', '在閘極的位置橫著切開'],
      plain: '一切從一片拋光到近乎完美的單晶矽晶圓開始。圖中下方的深藍色區塊就是矽基板，之後的電晶體都長在它的表面上。',
      detail: ['接下來兩張圖會一直同步播放。左圖（A–A′）順著電流的方向把電晶體切開，看得到載子從左邊的源極走到右邊的汲極；右圖（B–B′）在之後閘極所在的位置橫著切開，看得到閘極怎麼包住通道。'],
      beats: [{ now: '矽基板就位。', a: '矽基板。', b: '矽基板。' }],
      sources: ['pmc9920338'] },
    { n: 7, act: 2, title: '矽與矽鍺交錯堆疊', badges: ['generic'],
      pa: ['A–A′', '順著電流方向切開'], pb: ['B–B′', '在閘極的位置橫著切開'],
      plain: '在矽基板上一層矽鍺、一層矽，交替往上長。矽層之後會變成電流通過的「奈米片」；矽鍺層只是暫時墊在中間，最後會被挖掉。',
      detail: ['這種一層層長上去、而且新長的層會延續底下矽晶格排列的做法，叫做磊晶。關鍵在於兩種材料對某些蝕刻的反應不同，後面才能只挖掉矽鍺、留下矽。', '台積電沒有公開 N2 疊了幾層、每層多厚。學術論文的例子是矽與矽鍺各約 9 奈米、交替三組（非 N2 數據）。圖中畫三片矽。'],
      beats: [{ now: '矽鍺與矽交替磊晶，由下往上長出三組。', a: '黃色是矽鍺，淺藍是矽。', b: '橫切面看到的也是同樣的疊層。' }],
      sources: ['pmc9920338', 'pmc11173960'] },
    { n: 8, act: 2, title: '刻出鰭狀疊層', badges: ['generic', 'official', 'media'],
      pa: ['A–A′', '順著電流方向切開'], pb: ['B–B′', '在閘極的位置橫著切開'],
      plain: '先在表面蓋上硬遮罩，標出要保留的地方，再用電漿從上往下垂直蝕刻，把整片疊層切成一條條細長的鰭。鰭與鰭之間的溝槽底部再填入絕緣氧化層，把相鄰的元件隔開。',
      detail: ['這一步沿用 FinFET 時代的鰭圖形化做法。填在溝槽底部的絕緣層叫淺溝槽隔離（STI）。以 Applied Materials 的一份專利為例，氧化層會沉積在疊層的周圍；圖中省略了襯層等細節，實際做法各廠不同。', '右圖刻意畫成一寬一窄兩條鰭，代表同一顆晶片上兩種不同的設計（示意）。這對應台積電的 NanoFlex：官方說法是 N2 的標準單元（standard cell，晶片設計的基本積木）分成「矮單元」（省面積、省電）與「高單元」（拚效能），可以在同一個設計區塊裡混用；IEEE Spectrum 的報導則描述為同一顆晶片上可以用不同寬度的奈米片做成不同的邏輯單元。官方沒有直接說矮單元就是窄片。', '台積電沒有公開這一層是否使用 EUV（極紫外光微影，目前最先進的曝光技術）。'],
      beats: [
        { now: '蓋上硬遮罩，標出要留下的鰭。', a: '左圖順著鰭的方向看，整條都被遮罩蓋住。', b: '遮罩只蓋在兩條鰭的位置。' },
        { now: '垂直蝕刻：沒被遮住的疊層和底下一點點矽被挖掉。', a: '順著鰭的方向切，看不到切割發生，疊層完整保留。', b: '疊層被切成一寬一窄兩條鰭，代表兩種不同的設計（示意）。' },
        { now: '溝槽底部填入絕緣氧化層，高度回蝕到鰭的底部。', a: '這個剖面切在鰭上，看不到隔離層。', b: '灰青色的淺溝槽隔離填在兩條鰭之間。' },
        { now: '移除遮罩，鰭狀疊層完成。', a: '鰭狀疊層。', b: '寬鰭與窄鰭並排，底部由隔離層隔開。' },
      ],
      sources: ['pmc9920338', 'amatsti', 'pr3136', 'spectrum'] },
    { n: 9, act: 2, title: '假閘極與內側間隔層', badges: ['generic'],
      pa: ['A–A′', '順著電流方向切開'], pb: ['B–B′', '在閘極的位置橫著切開'],
      plain: '先放一條「假閘極」佔住未來真閘極的位置，再把兩側的疊層挖掉、留給源極和汲極，最後在矽鍺層的兩端補上小塊絕緣體。',
      detail: ['先做假閘極、最後才換成金屬閘極，是為了讓真正的閘極材料不必承受源汲極步驟的高溫。', '內側間隔層（inner spacer）是奈米片電晶體才有的關鍵模組：先從凹槽側面把矽鍺往內淺淺蝕刻出小凹洞，再填入絕緣材料、回蝕。它降低閘極與源汲極之間的寄生電容，也在後面挖除矽鍺時保護源汲極。', '難點在控制精度。論文的例子做到凹洞深度在 5±0.3 奈米以內、各層之間相當一致（非 N2 數據）。有效閘極長度同時取決於假閘極的寬度與內側間隔層的厚度。', '寄生電容是兩個導體靠得很近時自然形成、但設計上不想要的電容，會拖慢電晶體的開關速度。'],
      beats: [
        { now: '假閘極橫跨在鰭上，兩側貼上絕緣側壁。', a: '紅褐色是假閘極，兩側貼著絕緣側壁。', b: '假閘極從上方和兩側罩住鰭。' },
        { now: '挖掉假閘極兩側的疊層，留出源極和汲極的位置。', a: '只剩閘極和側壁底下的疊層。', b: '這個剖面切在閘極中央，沒有變化。' },
        { now: '從側面把矽鍺兩端蝕刻出小凹洞，填入絕緣材料。', a: '矽鍺兩端換成內側間隔層，與閘極側壁同一種顏色。', b: '這個剖面切在閘極中央，看不到內側間隔層。' },
      ],
      sources: ['pmc7221596', 'pmc11173960', 'pmc12844779'] },
    { n: 10, act: 2, title: '長出源極與汲極', badges: ['generic', 'media'],
      pa: ['A–A′', '順著電流方向切開'], pb: ['B–B′', '在閘極的位置橫著切開'],
      plain: '在凹槽裡用磊晶長出源極和汲極，緊貼著每一片矽的兩端。電晶體導通時，載子（電子或電洞）從源極出發，經過奈米片抵達汲極。',
      detail: ['台積電在 IEDM 2024（國際電子元件會議，半導體業最重要的研討會之一）的論文提到，N2 優化了奈米片厚度、接面、摻雜活化與應力工程（媒體轉述），但沒有公開源汲極的材料與結構。', '難點：奈米片末端如果在前面的步驟受損，源汲極就長不好，接觸電阻跟著上升。源汲極對通道施加的應力，也可能在之後讓懸空的奈米片變形。'],
      beats: [{ now: '源極與汲極從凹槽裡露出的矽表面長出來，接住每一片矽的兩端。', a: '綠色是源極（左）和汲極（右）。', b: '這個剖面切在閘極中央，看不到源汲極。' }],
      sources: ['pmc12844779', 'pmc9920338', 'toms'] },
    { n: 11, act: 2, title: '挖空矽鍺，奈米片懸空', badges: ['generic'],
      pa: ['A–A′', '順著電流方向切開'], pb: ['B–B′', '在閘極的位置橫著切開'],
      plain: '先用絕緣材料把源汲極蓋住，再拔掉假閘極，最後從閘極的溝槽把矽鍺全部挖掉。矽奈米片從此懸空，只靠兩端撐住。',
      detail: ['能「只挖矽鍺、不傷矽」，靠的是化學性質的差異：矽鍺之間的鍵結比矽與矽之間弱，氟系的蝕刻物質會優先和矽鍺反應。論文的例子中，矽鍺對矽的蝕刻選擇比達到 168:1，也就是挖掉 168 份矽鍺只損失 1 份矽（非 N2 數據）。', '難點有三個：懸空的奈米片可能因為應力變形；片與片之間的距離不一致，後面填入的功函數金屬厚度就不同，電晶體的臨界電壓（開始導通的電壓）跟著飄移；寬窄不同的片要同時釋放。論文也指出，濕式蝕刻在高深寬比的結構裡會受毛細作用影響而不穩定。', '台積電沒有公開 N2 用哪一種方法釋放通道。'],
      beats: [
        { now: '填入層間介電質並磨平，只露出假閘極頂部。', a: '青色的絕緣材料蓋住源汲極。', b: '這個剖面沒有變化。' },
        { now: '拔除假閘極，留下一條溝槽。', a: '閘極位置變成空的溝槽。', b: '假閘極拿掉後，鰭露了出來。' },
        { now: '選擇性蝕刻掉矽鍺，矽奈米片懸空。', a: '矽片之間空了，兩端靠內側間隔層與源汲極撐住。', b: '每條鰭變成三片懸空的矽片。' },
      ],
      sources: ['pmc7221596', 'pmc9920338'] },
    { n: 12, act: 2, title: '金屬閘極四面包覆', badges: ['generic', 'media'],
      pa: ['A–A′', '順著電流方向切開'], pb: ['B–B′', '在閘極的位置橫著切開'],
      plain: '用原子層沉積在每一片矽外面均勻包上極薄的絕緣層與功函數金屬，再把金屬填滿所有空隙。閘極從上、下、左、右四面包住每一片矽，這就是「全環繞閘極」（GAA）這個名字的由來。',
      detail: ['閘極從四面控制通道，電流比較關得住、漏電比較少；而且多疊幾片，就能在不增加佔地的情況下提高驅動電流。FinFET 只能靠增加鰭的數量來改變電晶體的通道寬度，奈米片則可以直接把片做寬或做窄。', '台積電 N2 提供 6 種臨界電壓（電晶體開始導通的電壓），範圍橫跨 200mV，用的是台積電第三代的偶極（dipole）整合技術，這是 N2 用來調出多種臨界電壓的方法（媒體轉述 IEDM 2024 論文）。臨界電壓越多種，設計者越能在速度和耗電之間細調。功函數金屬的材料與層數，台積電沒有公開。'],
      beats: [
        { now: '原子層沉積：每片矽外面包上一層極薄的高介電常數材料與功函數金屬。', a: '紫色薄層包住閘極範圍內的每一片矽。', b: '每片矽都被紫色薄層包住。' },
        { now: '金屬填滿所有空隙，真正的閘極完成。', a: '金屬閘極伸進矽片之間；兩端由內側間隔層隔開源汲極。', b: '金屬閘極從四面包住每一片矽。' },
        { now: '全環繞閘極：上、下、左、右四面都由閘極控制。', a: '虛線箭頭示意載子的路徑：從左邊的源極出發，穿過奈米片抵達右邊的汲極。', b: '箭頭標出閘極包覆中間那片矽的四個方向。' },
      ],
      sources: ['pmc9920338', 'pmc12844779', 'spectrum', 'toms', 'semiwiki'] },
    { n: 13, act: 3, title: '中段接點', badges: ['media', 'paper'],
      pa: ['①', '電晶體上方的接點（示意）'], pb: ['②', '閘極接點電阻'],
      plain: '電晶體做好之後，要先用一層「中段」接點把源極、汲極和閘極接出來，才能連到上面的金屬導線。',
      detail: ['依媒體轉述台積電 IEDM 2024 論文，N2 的中段改用免阻障層（barrier-free）的鎢線路，閘極接點（VG）電阻降低 55%，環形振盪器頻率提高約 6.2%；比較基準原文沒有寫明。', '論文 Fig.11 的圖內文字寫道，中段與後段合起來的 RC（電阻乘以電容，影響訊號延遲）降低約 20%。'],
      beats: [
        { now: '在電晶體上方覆蓋一層絕緣材料。', a: '電晶體（簡化）上方蓋上絕緣層。', b: '媒體轉述的閘極接點電阻變化。' },
        { now: '挖出接點孔、填入金屬，把源極、閘極、汲極接上來。', a: '三根接點：源極、閘極（VG）、汲極。', b: 'N2 改用免阻障層鎢，閘極接點電阻降 55%（比較基準未寫明）。' },
      ],
      sources: ['toms', 'iedm_fig11'] },
    { n: 14, act: 3, title: '後段金屬導線', badges: ['official', 'paper', 'media', 'generic'],
      pa: ['①', '金屬導線堆疊（示意）'], pb: ['②', '台積電論文圖：IEDM 2024 Fig.11'],
      plain: '接點之上是一層層的金屬導線，把電晶體連成電路。從右邊的台積電論文剖面可以看到，越下層的導線越細越密，越上層越粗。N2 的最上方還有高效能電容與銅重布線層（RDL），負責穩定供電、銜接先進封裝。',
      detail: ['依媒體轉述 IEDM 2024 論文，N2 的第一層金屬（M1）改用 EUV「一次曝光、一次蝕刻」（1P1E）完成，減少製程步驟與光罩數，標準單元電容降低近 10%（比較基準原文未寫明）。', '超高效能 MiM 電容（SHP-MiM）約 200 fF/mm²（論文 Fig.11 圖內文字），媒體轉述它能減少瞬間電壓下降、提高最高運作頻率。', '台積電官網與年報說，N2 開發了低電阻的重布線層（RDL）與超高效能 MiM 電容。論文 Fig.11 的圖說指出，新的銅 RDL 與保護層讓 N2 能和 3DFabric（SoIC、InFO、CoWoS）封裝整合。', '金屬層的間距與總層數，台積電沒有公開。'],
      beats: [
        { now: '第一層金屬（M1）：N2 用 EUV 一次曝光、一次蝕刻完成（媒體轉述）。', a: '最下層、最密的是 M1。', b: '論文剖面：最下方是奈米片電晶體，往上是中段與後段金屬。' },
        { now: '一層層往上疊：導線越往上越粗，層與層之間用通孔連接。', a: '越往上的金屬層越粗（層數為示意）。', b: '論文剖面：金屬層由下往上變粗。' },
        { now: '最上方：超高效能 MiM 電容與銅重布線層，銜接先進封裝。', a: 'MiM 電容（約 200 fF/mm²）、銅 RDL 與保護層；右端的保護層開口露出接墊（示意）。', b: '論文剖面：銅 RDL、MiM 電容與保護層。' },
      ],
      sources: ['toms', 'iedm_fig11', 'l2nm', 'ar2025', 'research97', 'amkor_wlcsp'] },
    { n: 15, act: 4, title: '晶圓測試與針測', badges: ['official', 'media', 'generic'],
      pa: ['①', '晶圓俯視（示意）'], pb: ['②', '測試結構與探針（示意）'],
      plain: '晶圓做完後要先測。WAT 量測晶圓上專門的測試結構，確認製程參數正常；接著針測（wafer sort）用探針一顆顆測晶片，把壞的標記起來，不送去封裝。',
      detail: ['WAT（晶圓允收測試）資料由晶圓廠在製造結束時產生，一般會提供給客戶；通常有四十到一百項測試，每項在晶圓上的每個測試點都有結果（業界通用說明）。', '針測是在晶圓狀態下做的簡單電性測試，主要目的是找出不良晶片，避免它們被封裝（業界通用說明）。', '台積電官網說，它提供包含業界領先探針卡與熱管理技術的完整測試方案，並和客戶共同開發測試程式。台積電 N2 的 WAT 與針測細節沒有公開。', '奈米片結構讓檢測更難：很多會讓電晶體失效的缺陷不在視線範圍內，而是在奈米片底面等難以觸及的地方（Semiconductor Engineering 引述 IBM）。'],
      beats: [
        { now: 'WAT：量測晶圓上專門的測試結構，確認製程參數正常。', a: '橘點是測試結構（位置為示意）。', b: '測試結構是專門用來量測製程的，不是客戶的電路。' },
        { now: '針測：探針卡接觸晶片上的接點，做快速電性測試。', a: '探針逐顆測試晶片（示意）。', b: '探針卡的針壓在晶片的接點上。' },
        { now: '測完的結果：壞的晶片標記起來，不送去封裝。', a: '橘色是測試沒過的晶片（示意，不是實際良率）。', b: '只有好的晶片會繼續往下走。' },
      ],
      sources: ['semi_wat', 'anysilicon', 'tsmc_ap', 'semi_ns'] },
    { n: 16, act: 4, title: '良率學習', badges: ['official', 'media'],
      pa: ['①', '缺陷密度隨時間下降（示意）'], pb: ['②', '各方說法'],
      plain: '新製程剛開始時缺陷比較多，隨著量產經驗累積，缺陷密度（D0）一路下降，良率跟著上升。台積電沒有公開 N2 的產品良率數字，法說會只說「良率良好」；論文揭露的是 SRAM 測試陣列的良率，不是產品良率。',
      detail: ['台積電在 2025 年北美技術論壇比較了 N2 與前幾代在同一開發階段的缺陷密度，但原始投影片沒有公開。媒體轉述有出入：Tom\'s Hardware 說 N2 低於 N3、N5、N7；TechPowerUp 轉引工商時報說與 5 奈米家族相當、優於 7 奈米與 3 奈米。', '2026 年論壇上，台積電表示 N2 缺陷密度下降的狀況比 N3 好（Semiconductor Engineering 轉述）。', '依 SemiWiki 對 IEDM 2024 論文的分析，N2 的 256Mb SRAM 測試陣列平均良率超過 80%、最高超過 90%。SRAM 測試載具的良率不等於產品良率。', '網路上流傳的 D0 數值是推算，不是台積電公布的，本頁不採用。'],
      beats: [
        { now: '缺陷密度隨量產經驗下降，良率跟著上升。', a: '示意曲線，沒有台積電公開的數值。', b: '法說會的官方說法。' },
        { now: '技術論壇與論文透露的線索，以及媒體說法的出入。', a: '台積電 2026 年論壇：N2 缺陷密度下降比 N3 好（媒體轉述）。', b: '各方說法並列。' },
      ],
      sources: ['q4_25', 'q1_26', 'q3_26', 'toms_d0', 'tpu_d0', 'semi2026', 'semiwiki_sram'] },
    { n: 17, act: 4, title: '切割與先進封裝', badges: ['official', 'generic'],
      pa: ['①', '從晶圓到封裝（示意）'], pb: ['②', '由誰做'],
      plain: '好的晶片從晶圓上切下來，再依產品需要做先進封裝（SoIC 也有晶圓直接對晶圓堆疊的做法）。台積電的 3DFabric 包括 SoIC（把晶片垂直堆疊）、CoWoS（把運算晶片和高頻寬記憶體一起放在中介層上）與 InFO（整合扇出型封裝）。',
      detail: ['台積電官網說，SoIC Gen-2 製程能與 N2 以後的先進 SoC 相容；SoIC 可以把不同尺寸、功能與製程的已知良好晶片（known good die）整合在一起，支援晶片對晶圓（CoW）與晶圓對晶圓（WoW）兩種方式。', 'CoWoS 把多顆 SoC 與高頻寬記憶體（HBM）整合在一起，是 AI 與高效能運算產品的基礎；CoWoS-L（3.5 倍光罩尺寸）自 2024 年量產。台積電 2026 年 10 月法說會表示已在量產 5 倍光罩尺寸的產品。', '哪個 N2 產品用哪種封裝，台積電沒有公開對照表。台積電 20-F 說封裝與測試由自己做或外包；2026 年 4 月法說會表示先進封裝產能很緊，需要和封測夥伴（OSAT）合作。', '晶圓切割與凸塊由誰執行，台積電沒有公開；封測廠如 Amkor 提供凸塊、針測、組裝與最終測試的一站式服務（業界通用）。'],
      beats: [
        { now: '切割：把晶圓上的晶片切成一顆顆。', a: '晶圓切割成單顆晶片（示意）。', b: '封裝與測試由誰做的公開說法。' },
        { now: 'SoIC：把晶片堆疊在另一顆晶片上。', a: 'SoIC：上下兩顆晶片堆疊（示意）。', b: '官方圖：用一般 SoC 與用 SoIC 的 CoWoS、InFO_PoP 對照。', pb: ['②', '官方圖：TSMC-SoIC 對照'] },
        { now: 'CoWoS：運算晶片與高頻寬記憶體放在中介層上，再接到封裝基板。', a: 'CoWoS 的結構（示意，省略各層之間的凸塊）。', b: '官方圖：CoWoS-S 結構。', pb: ['②', '官方圖：CoWoS-S 結構'] },
      ],
      sources: ['tsmc_3dfabric', 'tsmc_soic', 'tsmc_cowos', 'sec20f', 'q1_26', 'q3_26', 'amkor_bump'] },
    { n: 18, act: 4, title: '最終測試與出貨', badges: ['official', 'generic'],

      STEPS.filter(s => s.act === a.n).forEach(s => {
        const d = document.createElement('button'); d.type = 'button'; d.className = 'dot';
        d.textContent = s.short || s.n; d.dataset.n = s.n; d.setAttribute('aria-label', `${stepName(s)}：${s.title}`);
        d.addEventListener('click', () => go(s.n, 1));
        dots.appendChild(d);
      });
      acts.appendChild(box);
    });
  }

  function stepOf(n) { return STEPS.find(s => s.n === n); }

  function renderScene() {
    const k = key(cur.n, cur.b);
    ALL.forEach(e => e.classList.toggle('on', k >= e._on && k < e._off));
    applySel();
  }

  function visibleParts() {
    const set = new Set();
    ALL.forEach(e => { if (e.classList.contains('on') && e.dataset.part) set.add(e.dataset.part); });
    return PART_ORDER.filter(p => set.has(p));
  }

  function applySel() {
    ALL.forEach(e => e.classList.toggle('sel', !!selPart && e.dataset.part === selPart && e.classList.contains('on')));
  }

  function renderPart() {
    const box = $('part');
    if (!selPart || !visibleParts().includes(selPart)) {
      selPart = null;
      box.innerHTML = visibleParts().length ? '<p class="muted">點圖中任何一塊材料，或下方的圖例，看它是什麼、做什麼用。</p>' : '<p class="muted">這一步的圖是說明用的示意，沒有可點選的材料。</p>';
    } else {
      const p = partOf(selPart);
      box.innerHTML = `<div class="part-name"><span class="sw" style="background:var(--${swatch(selPart)})"></span>${p.name}</div>
        <div class="part-en">${p.en}</div><p class="part-text">${p.text}</p>`;
    }
    const ip = $('immPart');
    ip.hidden = !(imm && selPart);
    if (imm && selPart) {
      const p = partOf(selPart);
      ip.innerHTML = `<div class="row"><span class="sw" style="background:var(--${swatch(selPart)})"></span>${p.name}
        <button class="x" type="button" aria-label="關閉材料說明">關閉</button></div><p>${p.text}</p>`;
      ip.querySelector('.x').addEventListener('click', () => { selPart = null; applySel(); renderPart(); });
    }
    const lg = $('legend'); lg.innerHTML = '';
    const vis = visibleParts();
    if (!vis.length) { lg.innerHTML = '<span class="muted">這一步的圖沒有可點選的材料。</span>'; }
    vis.forEach(id => {
      const c = document.createElement('button'); c.type = 'button'; c.className = 'chip';
      c.setAttribute('aria-pressed', String(id === selPart));
      c.innerHTML = `<span class="sw" style="background:var(--${swatch(id)})"></span>${partOf(id).name}`;
      c.addEventListener('click', () => { selPart = selPart === id ? null : id; applySel(); renderPart(); });
      lg.appendChild(c);
    });
    applySel();
  }
  function swatch(id) { return need(SWATCH[id], `材料 ${id} 的色票`); }

  function renderText() {
    const s = stepOf(cur.n);
    const act = ACTS.find(a => a.n === s.act) || miss(`步驟 ${s.n} 所屬的幕`, { name: '', title: '' });
    $('eyebrow').textContent = `${act.name}・${act.title}　|　${s.label || `步驟 ${s.n}／${NUMBERED}`}`;
    $('title').textContent = s.title;
    $('where').textContent = `${act.name} ${act.title} › ${stepName(s)} ${s.title}`;
    $('badges').innerHTML = '<span class="badge generic">示意，非比例</span>'
      + (s.badges || []).map(t => `<span class="badge ${t}">含${need(TAG[t] && TAG[t].name, `來源類型 ${t}`)}資料</span>`).join('');
    const cross = $('cross'); cross.innerHTML = '';
    (s.cross || []).forEach(n => {
      const t = stepOf(n);
      if (!t) { miss(`步驟 ${s.n} 的 cross 指向的步驟 ${n}`); return; }
      const ta = ACTS.find(a => a.n === t.act);
      const c = document.createElement('button'); c.type = 'button'; c.className = 'chip';
      c.textContent = `交會（${ta ? LINE[ta.line] : ''}）：${stepName(t)} ${t.title}`;
      c.addEventListener('click', () => go(t.n, 1));
      cross.appendChild(c);
    });
    cross.hidden = !cross.children.length;
    const beat = s.beats[cur.b - 1] || {};
    $('nowWrap').hidden = !beat.now;
    $('now').textContent = need(beat.now, `步驟 ${s.n} 第 ${cur.b} 拍的 now`);
    $('plain').textContent = need(s.plain, `步驟 ${s.n} 的 plain`);
    $('capA').textContent = beat.a || '';
    $('capB').textContent = beat.b || '';
    const pa = beat.pa || s.pa || miss(`步驟 ${s.n} 的 pa`, ['', '']), pb = beat.pb || s.pb || miss(`步驟 ${s.n} 的 pb`, ['', '']);
    $('paCut').textContent = pa[0]; $('paText').textContent = pa[1];
    $('pbCut').textContent = pb[0]; $('pbText').textContent = pb[1];
    $('svgA').setAttribute('aria-label', pa[1]); $('svgB').setAttribute('aria-label', pb[1]);
    $('detailWrap').hidden = !s.detail;
    $('detail').innerHTML = (s.detail || []).map(p => `<p>${p}</p>`).join('');
    const src = $('sources'); src.innerHTML = '';
    (s.sources || miss(`步驟 ${s.n} 的 sources`, [])).forEach(id => {
      const o = SRC[id];
      if (!o) { miss(`來源 ${id}`); return; }
      const li = document.createElement('li');
      li.innerHTML = `<span class="t" style="color:var(--tag-${o.t})">${need(TAG[o.t] && TAG[o.t].name, `來源類型 ${o.t}`)}</span><a href="${o.url}" target="_blank" rel="noopener">${o.label}</a>`;
      src.appendChild(li);
    });
    $('suppliers').innerHTML = s.sup
      ? s.sup.map(g => `<div class="supg"><b>${SUP[g].name}</b><span>${SUP[g].list.map(([nm, lv]) =>
          `<span class="sup ${lv}">${lv === 'S' ? '●' : '○'} ${nm}</span>`).join('')}</span></div>`).join('')
        + `<p class="muted">● 有公開資料顯示供貨給${META.subject}或與${META.subject}合作（供應商獎、官方名單、雙方新聞稿或媒體報導）　○ 該類主要廠商。名單依類別列出，沒有逐家證明用在這一步${META.supCaveat ? '，' + META.supCaveat : ''}。</p>`
      : need(s.supNote, `步驟 ${s.n} 的 sup 或 supNote`);

    document.querySelectorAll('.dot').forEach(d => {
      const n = Number(d.dataset.n);
      d.classList.toggle('cur', n === cur.n); d.classList.toggle('done', n < cur.n);
      d.setAttribute('aria-current', n === cur.n ? 'step' : 'false');
    });
    document.querySelectorAll('.act').forEach(a => a.classList.toggle('cur', Number(a.dataset.act) === s.act));
    const pips = $('pips'); pips.innerHTML = '';
    s.beats.forEach((_, i) => { const p = document.createElement('span'); p.className = 'pip' + (i < cur.b ? ' on' : ''); pips.appendChild(p); });
    $('beatlabel').textContent = `${cur.b}／${s.beats.length}`;
    $('immNow').textContent = beat.now || '';
    const idx = STEPS.indexOf(s);
    $('prev').disabled = idx === 0 && cur.b === 1;
    $('next').disabled = idx === STEPS.length - 1 && cur.b === s.beats.length;
  }

  // 內部的 b 是拍號，從 1 起，與場景的「步號.拍號」一致
  function go(n, b) {
    cur = { n, b };
    renderScene(); renderText(); renderPart();
    try { history.replaceState(null, '', '#s' + n); } catch (e) { /* 部分環境不允許改網址 */ }
  }
  // 依 STEPS 陣列順序前後移動
  function next() {
    const s = stepOf(cur.n), i = STEPS.indexOf(s);
    if (cur.b < s.beats.length) go(cur.n, cur.b + 1);
    else if (i < STEPS.length - 1) go(STEPS[i + 1].n, 1);
  }
  function prev() {
    const i = STEPS.indexOf(stepOf(cur.n));
    if (cur.b > 1) go(cur.n, cur.b - 1);
    else if (i > 0) { const p = STEPS[i - 1]; go(p.n, p.beats.length); }
  }

  [A, B].forEach(svg => svg.addEventListener('click', ev => {
    const t = ev.target.closest('.el.on[data-part]');
    if (!t) return;
    selPart = selPart === t.dataset.part ? null : t.dataset.part;
    applySel(); renderPart();
  }));
  $('next').addEventListener('click', next);
  $('prev').addEventListener('click', prev);
  document.addEventListener('keydown', ev => {
    if (ev.target.closest && ev.target.closest('input, textarea, select')) return;
    if (ev.key === 'ArrowRight') { ev.preventDefault(); next(); }
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); prev(); }
    if (ev.key === 'Escape' && imm) { ev.preventDefault(); setImm(false); }
  });

  // ---------- 沉浸模式 ----------
  const stage = $('stage');
  const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function setImm(on) {
    imm = on;
    stage.classList.toggle('immersive', on);
    document.documentElement.classList.toggle('imm-lock', on);
    document.querySelectorAll('.wrap > :not(#stage)').forEach(e => { e.inert = on; });
    const btn = $('immBtn');
    btn.textContent = on ? '結束全螢幕' : '全螢幕觀看';
    btn.setAttribute('aria-pressed', String(on));
    if (on) {
      stage.setAttribute('role', 'dialog'); stage.setAttribute('aria-modal', 'true');
      const frames = reduceMotion() ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, transform: 'scale(0.98)' }, { opacity: 1, transform: 'none' }];
      stage.animate(frames, { duration: reduceMotion() ? 200 : 260, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
      $('next').focus();
    } else {
      stage.removeAttribute('role'); stage.removeAttribute('aria-modal');
      btn.focus();
    }
    renderPart();
  }
  $('immBtn').addEventListener('click', () => setImm(!imm));

  // 全螢幕時左右滑動切換；只認觸控，且水平位移要明顯大於垂直位移
  let touchStart = null;
  $('panels').addEventListener('pointerdown', ev => { if (imm && ev.pointerType === 'touch') touchStart = { x: ev.clientX, y: ev.clientY }; });
  $('panels').addEventListener('pointerup', ev => {
    if (!touchStart) return;
    const dx = ev.clientX - touchStart.x, dy = ev.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { dx < 0 ? next() : prev(); }
  });
  $('panels').addEventListener('pointercancel', () => { touchStart = null; });

  function fromHash() {
    const m = /^#s(\d+)$/.exec(location.hash);
    const n = m ? Number(m[1]) : NaN;
    return stepOf(n) ? n : STEPS[0].n;
  }
  window.addEventListener('hashchange', () => { const n = fromHash(); if (n !== cur.n) go(n, 1); });

  // ---------- 場景傾印：給連接檢查工具讀 ----------
  // 回傳目前顯示中、帶 data-net 的元件；座標是 getBBox() 的 viewBox 單位。只支援 <rect>。
  function dumpScene() {
    const out = [];
    [['A', A], ['B', B]].forEach(([name, svg]) => svg.querySelectorAll('.el.on[data-net]').forEach(e => {
      if (e.tagName.toLowerCase() !== 'rect') { console.error(`walkthrough：data-net 只支援 <rect>，略過 ${e.id || e.tagName}`); return; }
      const r = e.getBBox();
      out.push({ id: e.id, svg: name, part: e.dataset.part || '', net: e.dataset.net, kind: e.dataset.kind || 'node', x: r.x, y: r.y, w: r.width, h: r.height });
    }));
    return out;
  }

  renderMeta();
  buildRail();
  go(fromHash(), 1);

  // 對外介面：go(n, b) 的 b 是 beats 陣列索引，從 0 起
  window.walkthrough = {
    meta: META, steps: STEPS, tags: TAG,
    go(n, b = 0) {
      const s = stepOf(n);
      if (!s || !(b >= 0 && b < s.beats.length)) { console.error(`walkthrough.go：沒有步驟 ${n} 的第 ${b} 拍`); return; }
      go(n, b + 1);
    },
    setImmersive(on) { setImm(!!on); },
    dumpScene,
  };
})();
</script>
